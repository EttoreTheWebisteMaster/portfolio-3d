# Local gate: fast checks on staged files, heavier ones before push.
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{js,mjs,ts,tsx,css,json,md,yml,yaml}"
      run: npx prettier --write --log-level warn {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "*.{js,mjs,ts,tsx}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    - name: styles
      glob: "src/**/*.{tsx,jsx,css,scss}"
      run: node scripts/check-styles.mjs {staged_files}
    - name: secrets
      run: command -v gitleaks >/dev/null && gitleaks git --staged --no-banner --redact || true

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: npm run -s typecheck
    - name: deadcode
      run: npm run -s knip
    - name: styles-full
      run: npm run -s styles
