<!doctype html>
<html>
<head><meta charset="utf-8"><title>Scene — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@500;600;700;800;900&family=Caveat:wght@700&family=Instrument+Sans:wght@400;500;600&family=Tac+One&display=swap"></head>
<body class="es-preview">
<div class="es-row" style="align-items:stretch">
  <div class="es-scene" style="width:300px;height:200px;padding:24px;box-sizing:border-box;--light-x:12%;--light-y:0%;--light-strength:24%">
    <div class="es-meter-label">Tungsten · top-left</div>
    <p class="body" style="margin:12px 0 0;max-width:22ch">A spotlight with a visible source. Everything else falls to shadow.</p>
  </div>
  <div class="es-scene es-scene--screen-light" style="width:300px;height:200px;padding:24px;box-sizing:border-box;--light-x:50%;--light-y:30%;--light-strength:16%">
    <div class="es-meter-label">Screen spill · centre</div>
    <p class="body" style="margin:12px 0 0;max-width:22ch">The trailer is the room's only light.</p>
  </div>
</div>
</body>
</html>
