<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leader · first visit, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@500;600;700;800;900&amp;family=Caveat:wght@700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Tac+One&amp;display=swap">
<style>
.rob-logo .last{transition:color 260ms cubic-bezier(.2,.7,0,1)}.rob-logo:hover .last,.rob-logo.is-hover .last{color:#F2EDDA}
body{margin:0;background:#000}
a{color:#FFD84D}a:hover{color:#FFE680}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0B0A09; font-family: 'Instrument Sans', system-ui, sans-serif; color: #F2EDDA">

  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; overflow: hidden; background: radial-gradient(ellipse 58% 64% at 50% 49%, #3D372E 0%, #27221D 48%, #141110 100%)">

    <div style="position: absolute; right: -180px; top: -160px; width: 680px; height: 560px; border-radius: 50%; background: radial-gradient(closest-side, rgba(242,120,38,0.34), rgba(242,120,38,0) 100%)"></div>
    <div style="position: absolute; left: -220px; bottom: -240px; width: 600px; height: 520px; border-radius: 50%; background: radial-gradient(closest-side, rgba(215,60,30,0.26), rgba(215,60,30,0) 100%)"></div>

    <div style="position: absolute; left: 0; top: 450px; width: 1440px; height: 1px; background: rgba(242,237,218,0.30)"></div>
    <div style="position: absolute; left: 720px; top: 0; width: 1px; height: 900px; background: rgba(242,237,218,0.30)"></div>

    <div style="position: absolute; left: 442px; top: 172px; width: 556px; height: 556px; box-sizing: border-box; border-radius: 50%; border: 2px solid rgba(242,237,218,0.62); overflow: hidden">
      <div style="position: absolute; inset: 0; border-radius: 50%; background: {{sweep}}"></div>
    </div>
    <div style="position: absolute; left: 486px; top: 216px; width: 468px; height: 468px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid rgba(242,237,218,0.42)"></div>

    <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; display: flex; align-items: center; justify-content: center">
      <div style="font-family: 'Tac One', sans-serif; font-size: 300px; line-height: 1; color: #FFD84D; text-shadow: 0 0 36px rgba(255,216,77,0.45), 0 0 140px rgba(255,216,77,0.22); transform: translateY(8px)">{{num}}</div>
    </div>

    <svg aria-hidden="true" width="1440" height="900" style="position: absolute; left: 0; top: 0; pointer-events: none">
      <line x1="318" y1="0" x2="313" y2="900" stroke="rgba(242,237,218,0.10)"></line>
      <line x1="1104" y1="160" x2="1107" y2="900" stroke="rgba(242,237,218,0.07)"></line>
      <line x1="871" y1="0" x2="872" y2="360" stroke="rgba(242,237,218,0.06)"></line>
      <circle cx="1188" cy="286" r="1.5" fill="rgba(242,237,218,0.35)"></circle>
      <circle cx="262" cy="584" r="1" fill="rgba(242,237,218,0.30)"></circle>
      <circle cx="604" cy="168" r="1.2" fill="rgba(242,237,218,0.28)"></circle>
    </svg>

    <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 75% 80% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.66) 100%); pointer-events: none"></div>

    <svg aria-hidden="true" width="1440" height="900" style="position: absolute; left: 0; top: 0; opacity: 0.16; mix-blend-mode: overlay; pointer-events: none">
      <filter id="grainA"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
      <rect width="1440" height="900" filter="url(#grainA)"></rect>
    </svg>

    <div style="position: absolute; left: 64px; bottom: 128px; width: 520px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 16px">
        <span style="font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #A9A296; font-variant-numeric: tabular-nums">Loading · {{pct}}%</span>
        <span style="position: relative; display: block; width: 120px; height: 2px; background: rgba(242,237,218,0.16)"><span style="position: absolute; left: 0; top: 0; height: 2px; width: {{pct}}%; background: #FFD84D; box-shadow: 0 0 8px rgba(255,216,77,0.6)"></span></span>
      </div>
      <h1 style="margin: 4px 0 0; font-family: 'Alumni Sans', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.95; letter-spacing: 0.02em; text-transform: uppercase; color: #F2EDDA">Ettore Serra</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #CFC8B8">Designer &amp; engineer · Turin, or remote</p>
    </div>

    <div style="position: absolute; right: 64px; bottom: 128px; display: flex; flex-direction: column; align-items: flex-end; gap: 18px">
      <span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 28px; line-height: 1; color: #F2A93B; transform: rotate(-3deg); margin-right: 8px">best with sound on</span>
      <div style="display: flex; gap: 12px">
        <button type="button" style="display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 28px 0 18px; border: 0; border-radius: 0; background: #FFD84D; color: #15120F; font-family: 'Alumni Sans', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase; box-shadow: 0 0 28px rgba(255,216,77,0.32), 0 0 2px rgba(255,216,77,0.9); cursor: pointer">
          <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: #15120F; color: #FFD84D">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M3 9h4l6-5v16l-6-5H3z" fill="currentColor"></path><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" style="stroke-width: 2px; stroke-linecap: square"></path></svg>
          </span>
          Enter with sound
        </button>
        <button type="button" style="height: 60px; padding: 0 28px; border: 0; border-radius: 0; background: rgba(242,237,218,0.12); color: #F2EDDA; font-family: 'Alumni Sans', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer">Enter in silence</button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: {{bar}}px; background: #000; box-shadow: 0 1px 0 rgba(0,0,0,0.6)"></div>
  <div style="position: absolute; left: 0; bottom: 0; width: 1440px; height: {{bar}}px; background: #000; box-shadow: 0 -1px 0 rgba(0,0,0,0.6)"></div>

  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 72px; box-sizing: border-box; padding: 0 64px; background: transparent; display: flex; align-items: center; justify-content: space-between">
    <a href="#" class="rob-logo" aria-label="Ettore Serra, home" style="display: flex; align-items: baseline; gap: 0.5em; text-decoration: none; font-family: 'Alumni Sans', sans-serif; font-size: 16px; line-height: 1; letter-spacing: 0.24em; text-transform: uppercase">
      <span style="font-weight: 800; color: #F2EDDA">Ettore</span><span class="last" style="font-weight: 600; color: #8C8576">Serra</span>
    </a>
    <div style="display: flex; align-items: center; gap: 20px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E675B; font-variant-numeric: tabular-nums">TC</span>
        <span style="font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #F2EDDA; font-variant-numeric: tabular-nums">00:00:03<span style="color: #8C8576">:12</span></span>
        <span aria-hidden="true" style="position: relative; display: block; width: 44px; height: 1px; background: rgba(242,237,218,0.22)"><span style="position: absolute; left: 0%; top: -3px; width: 1px; height: 7px; background: #FFD84D; box-shadow: 0 0 6px rgba(255,216,77,0.8)"></span></span>
      </div>
      <span aria-hidden="true" style="display: block; width: 1px; height: 16px; background: rgba(242,237,218,0.18)"></span>
      <button type="button" aria-pressed="false" aria-label="Sound" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin: 0 -5px 0 0; padding: 0; border: 0; border-radius: 0; background: transparent; cursor: pointer"><svg aria-hidden="true" width="34" height="14" viewBox="0 0 34 14" style="display: block"><line x1="0" y1="7" x2="34" y2="7" stroke="#A9A296" style="stroke-width: 1.5px; stroke-dasharray: 2 3"></line></svg></button>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; width: 1440px; height: 72px; box-sizing: border-box; padding: 0 64px; display: flex; align-items: center; justify-content: space-between; font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #A9A296">
    <span>Portfolio · 2026</span>
    <span>Turin, Italy</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"progress":{"editor":"range","min":0,"max":100,"step":1,"unit":"%","default":64},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props.progress ?? 64;
    p = Math.max(0, Math.min(100, Math.round(p)));
    var num = Math.max(1, 5 - Math.floor(p / 20));
    var deg = (p / 100) * 360;
    var sweep = 'conic-gradient(rgba(242,237,218,0.22) 0deg ' + deg + 'deg, rgba(242,237,218,0) ' + deg + 'deg 360deg)';
    var t = p <= 80 ? 0 : (p - 80) / 20;
    var eased = 1 - Math.pow(1 - t, 3);
    var bar = Math.round(eased * 72);
    return { pct: p, num: num, sweep: sweep, bar: bar, markDash: (p / 100 * 69.12).toFixed(2) };
  }
}
</script>
</body>
</html>
