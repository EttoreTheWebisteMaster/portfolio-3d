<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Footer strip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@500;600;700;800;900&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#FFD84D}a:hover{color:#FFE680}
.fs-link{transition:color 160ms cubic-bezier(.2,.7,0,1)}
.fs-link:hover{color:#F2EDDA}
.fs-top:hover{text-shadow:0 0 14px rgba(255,216,77,0.6)}
.fs-link:focus-visible,.fs-top:focus-visible{outline:2px solid #FFD84D;outline-offset:3px}
</style>
</helmet>
<footer style="position: relative; width: 1440px; height: 272px; box-sizing: border-box; padding: 0 64px; background: #0B0A09; color: #F2EDDA; font-family: 'Instrument Sans', system-ui, sans-serif; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 64px; right: 64px; top: 0; height: 1px; background: rgba(242,237,218,0.14)"></div>

  <div style="height: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Alumni Sans', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; color: #F2EDDA">© 2026 Ettore Serra</span>
      <span style="font-size: 14px; line-height: 1.5; color: #A9A296">Designed and built in Turin. Next.js, Three.js, GSAP.</span>
    </div>

    <a href="#top" class="fs-top" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; text-decoration: none; font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #FFD84D">Back to top <span aria-hidden="true">↑</span></a>

    <div style="justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
      <nav aria-label="Elsewhere" style="display: flex; gap: 28px">
        <a href="mailto:serra.ettore.es@gmail.com" class="fs-link" style="display: inline-flex; align-items: center; height: 32px; text-decoration: none; font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: #A9A296">Email</a>
        <a href="https://www.linkedin.com/in/ettore-serra-developer" class="fs-link" style="display: inline-flex; align-items: center; height: 32px; text-decoration: none; font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: #A9A296">LinkedIn</a>
        <a href="https://github.com/EttoreTheWebisteMaster" class="fs-link" style="display: inline-flex; align-items: center; height: 32px; text-decoration: none; font-family: 'Alumni Sans', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.1em; text-transform: uppercase; color: #A9A296">GitHub</a>
      </nav>
      <span style="font-size: 14px; line-height: 1.5; color: #8C857A">Robot model by Tomás Laulhé / Quaternius, CC0.</span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":272}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
