# Developer + deep reviewer — Claude, billed to your Pro/Max plan (no API cost).
# Secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` locally).
#  • Comment "@claude <task>" on an issue/PR → implements it and opens/updates a PR.
#  • Add label "claude-review" to a PR → full review with inline comments.
# Only the repo OWNER can trigger it, so strangers can't burn your quota.
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [labeled]

jobs:
  develop:
    if: >
      github.event_name != 'pull_request' &&
      (
        (github.event.comment && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
        (github.event.issue && github.event_name == 'issues' && contains(github.event.issue.body, '@claude') && github.event.issue.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model sonnet --max-turns 40"

  review:
    if: github.event_name == 'pull_request' && github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model sonnet --max-turns 25 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
